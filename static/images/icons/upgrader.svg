<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Bezel Metallic Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Holographic Wheel Inset -->
    <radialGradient id="dialInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#050212"/>
    </radialGradient>
    <!-- Neon Arc Gradient -->
    <linearGradient id="neonArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="dialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Drop Shadow -->
  <circle cx="64" cy="68" r="50" fill="rgba(0, 0, 0, 0.45)" filter="blur(6px)"/>

  <!-- Outer Metallic Bezel Ring -->
  <circle cx="64" cy="64" r="50" fill="url(#bezelGrad)"/>
  <circle cx="64" cy="64" r="44" fill="url(#dialInner)" stroke="#1e1b4b" stroke-width="2"/>

  <!-- Bezel Highlight Ring -->
  <path d="M24,40 C34,22 54,16 76,16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Glowing Neon Success Sector Arc -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#2e1065" stroke-width="6"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#neonArc)" stroke-width="6" stroke-dasharray="140 230" stroke-linecap="round" filter="url(#dialGlow)"/>

  <!-- Dial Tick Marks -->
  <g stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5">
    <line x1="64" y1="23" x2="64" y2="27"/>
    <line x1="64" y1="101" x2="64" y2="105"/>
    <line x1="23" y1="64" x2="27" y2="64"/>
    <line x1="101" y1="64" x2="105" y2="64"/>
  </g>

  <!-- Central Hub -->
  <circle cx="64" cy="64" r="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="10" fill="#7c3aed"/>
  <circle cx="64" cy="64" r="5" fill="#f8fafc"/>

  <!-- Glowing Arrow Needle Pointer Pointing Up-Right -->
  <g transform="translate(64, 64) rotate(42)">
    <!-- Needle body -->
    <polygon points="-3,-5 0,-34 3,-5 2,8 -2,8" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>
    <!-- Glowing tip -->
    <circle cx="0" cy="-34" r="3" fill="#ffffff" filter="url(#dialGlow)"/>
  </g>

  <!-- Central Specular Dot -->
  <circle cx="62" cy="62" r="2" fill="#ffffff" opacity="0.9"/>
</svg>
