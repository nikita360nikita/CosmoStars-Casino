<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Coin 3D Outer Rim Gradient -->
    <linearGradient id="coinGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Inner Coin Face Gradient -->
    <radialGradient id="coinFace" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <!-- Embossed Star Gradient -->
    <linearGradient id="starEmboss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="7" fill="rgba(0, 0, 0, 0.45)" filter="blur(4px)"/>

  <!-- 3D Coin Edge / Thickness (Bottom Layer) -->
  <circle cx="64" cy="68" r="48" fill="#78350f"/>

  <!-- Main Coin Face Ring -->
  <circle cx="64" cy="64" r="48" fill="url(#coinGoldRim)"/>
  <circle cx="64" cy="64" r="42" fill="url(#coinFace)" stroke="#78350f" stroke-width="1.5"/>

  <!-- Inner Beaded Ring (Milled Pattern) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Embossed Telegram Star Centerpiece -->
  <g transform="translate(64, 64)" filter="url(#coinGlow)">
    <!-- Star Drop Shadow inside coin -->
    <polygon points="0,-24 7,-7 24,-7 11,4 16,21 0,11 -16,21 -11,4 -24,-7 -7,-7" fill="#78350f" transform="translate(0, 2)"/>
    <!-- Main Embossed Star -->
    <polygon points="0,-24 7,-7 24,-7 11,4 16,21 0,11 -16,21 -11,4 -24,-7 -7,-7" fill="url(#starEmboss)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Facet Facets Light Line -->
    <line x1="0" y1="-24" x2="0" y2="11" stroke="#ffffff" stroke-width="1" opacity="0.65"/>
    <line x1="-24" y1="-7" x2="11" y2="4" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Rim Specular Arc Curve -->
  <path d="M30,36 C40,24 60,18 84,20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="44" cy="30" rx="4" ry="2" fill="#ffffff" opacity="0.95"/>
</svg>
