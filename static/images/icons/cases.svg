<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gold Gradient for Chest Body -->
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Satin Purple Ribbon -->
    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <!-- Box Inset Violet -->
    <linearGradient id="boxInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#150524"/>
    </linearGradient>
    <filter id="goldChestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="8" fill="rgba(0, 0, 0, 0.6)" filter="blur(4px)"/>

  <!-- Golden Chest Base Container -->
  <rect x="22" y="58" width="84" height="52" rx="10" fill="url(#boxInner)" stroke="url(#goldBody)" stroke-width="4"/>

  <!-- Metal Corner Brackets -->
  <path d="M22,70 L34,70 L34,58 L22,58 Z" fill="url(#goldBody)"/>
  <path d="M106,70 L94,70 L94,58 L106,58 Z" fill="url(#goldBody)"/>
  <path d="M22,98 L34,98 L34,110 L22,110 Z" fill="url(#goldBody)"/>
  <path d="M106,98 L94,98 L94,110 L106,110 Z" fill="url(#goldBody)"/>

  <!-- Satin Purple Ribbon Wrapping (Vertical) -->
  <rect x="56" y="58" width="16" height="52" fill="url(#purpleRibbon)"/>
  <path d="M56,58 L56,110" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <path d="M72,58 L72,110" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>

  <!-- Glowing Telegram Star Emblem on Front Lock -->
  <g transform="translate(64, 84)" filter="url(#goldChestGlow)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#goldBody)" stroke-width="2.5"/>
    <polygon points="0,-9 2.5,-2.5 9,-2.5 4,1.5 6,8 0,4 -6,8 -4,1.5 -9,-2.5 -2.5,-2.5" fill="#fef08a"/>
  </g>

  <!-- Floating / Open Chest Lid (Tilted 3D look) -->
  <g transform="translate(0, -6)">
    <!-- Lid Outer Shell -->
    <rect x="18" y="38" width="92" height="24" rx="8" fill="url(#goldBody)" stroke="#78350f" stroke-width="1.5"/>
    <!-- Lid Top Highlight -->
    <path d="M22,42 L106,42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Lid Ribbon (Vertical) -->
    <rect x="56" y="38" width="16" height="24" fill="url(#purpleRibbon)"/>
    <!-- Ribbon Bow Knot on Top -->
    <g transform="translate(64, 38)">
      <!-- Left loop -->
      <path d="M0,0 C-12,-16 -24,-8 -12,0 Z" fill="url(#purpleRibbon)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <!-- Right loop -->
      <path d="M0,0 C12,-16 24,-8 12,0 Z" fill="url(#purpleRibbon)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <!-- Center gem -->
      <circle cx="0" cy="0" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Sparkles Floating Out -->
  <g transform="translate(24, 26)">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#fef08a"/>
  </g>
  <g transform="translate(104, 24)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#38bdf8"/>
  </g>
  <circle cx="98" cy="46" r="2" fill="#fbbf24"/>
</svg>
