<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gift Box Velvet Gradient -->
    <linearGradient id="boxVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="85%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <!-- Gold Ribbon Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="giftStarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="7" fill="rgba(0, 0, 0, 0.5)" filter="blur(4px)"/>

  <!-- Lower Gift Box Body -->
  <rect x="24" y="52" width="80" height="58" rx="10" fill="url(#boxVelvet)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Left highlight line -->
  <path d="M28,56 L28,104" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertical Gold Ribbon -->
  <rect x="56" y="52" width="16" height="58" fill="url(#goldRibbon)"/>
  <path d="M56,52 L56,110" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Horizontal Gold Ribbon -->
  <rect x="24" y="74" width="80" height="14" fill="url(#goldRibbon)"/>
  <path d="M24,74 L104,74" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Box Upper Lid (Tilted/Overhanging) -->
  <rect x="20" y="44" width="88" height="16" rx="6" fill="#a855f7" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="56" y="44" width="16" height="16" fill="url(#goldRibbon)"/>

  <!-- Rich Satin Ribbon Bow on Top -->
  <g transform="translate(64, 44)">
    <!-- Left Loop -->
    <path d="M0,0 C-16,-22 -30,-6 -6,-2 Z" fill="url(#goldRibbon)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- Right Loop -->
    <path d="M0,0 C16,-22 30,-6 6,-2 Z" fill="url(#goldRibbon)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- Hanging Ribbon Tails -->
    <path d="M-4,0 C-12,12 -18,22 -22,26" fill="none" stroke="url(#goldRibbon)" stroke-width="3" stroke-linecap="round"/>
    <path d="M4,0 C12,12 18,22 22,26" fill="none" stroke="url(#goldRibbon)" stroke-width="3" stroke-linecap="round"/>
    <!-- Center Ribbon Knot -->
    <circle cx="0" cy="0" r="6" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Telegram Star Emblem Center Ribbon Overlay -->
  <g transform="translate(64, 81)" filter="url(#giftStarGlow)">
    <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="#ffffff"/>
  </g>

  <!-- Magic Sparkles -->
  <circle cx="20" cy="36" r="2" fill="#fef08a"/>
  <circle cx="106" cy="32" r="2.5" fill="#38bdf8"/>
</svg>
