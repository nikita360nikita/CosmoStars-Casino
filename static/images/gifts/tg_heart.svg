<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Facet Gradients -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#fb7185" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#fb7185" text-anchor="middle" letter-spacing="0.5">RARE</text>

  <!-- 3D Official Telegram Sparkling Heart (Faceted Ruby Gem) -->
  <g transform="translate(128, 142)" filter="url(#heartGlow)">
    <!-- Base Shadow -->
    <path d="M0,52 C-45,20 -60,-15 -28,-36 C-10,-48 0,-24 0,-24 C0,-24 10,-48 28,-36 C60,-15 45,20 0,52 Z" fill="#4c0519" transform="translate(0, 6)"/>

    <!-- Central Center Diamond Facet -->
    <polygon points="0,-15 -22,-6 0,22 22,-6" fill="url(#facetHighlight)" stroke="#ffffff" stroke-width="1"/>

    <!-- Top Left Upper Facet -->
    <polygon points="0,-15 -22,-6 -34,-26 -16,-38 0,-26" fill="url(#facetHighlight)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Top Right Upper Facet -->
    <polygon points="0,-15 22,-6 34,-26 16,-38 0,-26" fill="#fda4af" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Left Outer Corner Facet -->
    <polygon points="-22,-6 -52,-14 -34,-26" fill="url(#facetMid)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Right Outer Corner Facet -->
    <polygon points="22,-6 52,-14 34,-26" fill="url(#facetDark)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Left Mid Side Facet -->
    <polygon points="-22,-6 0,22 -38,12 -52,-14" fill="url(#facetMid)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Right Mid Side Facet -->
    <polygon points="22,-6 0,22 38,12 52,-14" fill="url(#facetDark)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Bottom Left Point Facet -->
    <polygon points="0,22 0,52 -38,12" fill="url(#facetDark)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Bottom Right Point Facet -->
    <polygon points="0,22 0,52 38,12" fill="#4c0519" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Brilliant Sparkle Stars -->
    <polygon points="-22,-36 -20,-31 -15,-29 -20,-27 -22,-22 -24,-27 -29,-29 -24,-31" fill="#ffffff"/>
    <polygon points="34,-6 36,-2 40,0 36,2 34,6 32,2 28,0 32,-2" fill="#ffffff"/>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
