<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="kraftPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="bouquetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="0.5">RARE</text>

  <!-- 3D Official Telegram Spring Bouquet -->
  <g transform="translate(128, 142)" filter="url(#bouquetGlow)">
    <!-- Kraft Paper Wrapping Cone -->
    <polygon points="0,52 -38,0 38,0" fill="url(#kraftPaper)" stroke="#78350f" stroke-width="1.5"/>
    <polygon points="0,52 -18,10 0,5" fill="#b45309"/>

    <!-- Silk Cyan Ribbon Tie -->
    <ellipse cx="0" cy="18" rx="14" ry="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1"/>
    <path d="M-6,18 C-12,28 -16,36 -20,40 M6,18 C12,28 16,36 20,40" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>

    <!-- Lush Floral Bunch (Top) -->
    <!-- Green Leaves -->
    <circle cx="-32" cy="-14" r="14" fill="#15803d"/>
    <circle cx="32" cy="-14" r="14" fill="#15803d"/>
    <circle cx="0" cy="-38" r="14" fill="#16a34a"/>

    <!-- Pink Peony (Center Left) -->
    <circle cx="-16" cy="-18" r="16" fill="#f43f5e"/>
    <circle cx="-16" cy="-18" r="11" fill="#fb7185"/>
    <circle cx="-16" cy="-18" r="6" fill="#ffe4e6"/>

    <!-- Golden Rose (Center Right) -->
    <circle cx="16" cy="-18" r="16" fill="#f59e0b"/>
    <circle cx="16" cy="-18" r="11" fill="#fbbf24"/>
    <circle cx="16" cy="-18" r="6" fill="#fef08a"/>

    <!-- Purple Lavender / Violet (Top Center) -->
    <circle cx="0" cy="-32" r="15" fill="#8b5cf6"/>
    <circle cx="0" cy="-32" r="10" fill="#c084fc"/>
    <circle cx="0" cy="-32" r="5" fill="#f3e8ff"/>

    <!-- White Daisy Accents -->
    <circle cx="-28" cy="-32" r="7" fill="#ffffff"/>
    <circle cx="-28" cy="-32" r="3" fill="#fbbf24"/>
    <circle cx="28" cy="-32" r="7" fill="#ffffff"/>
    <circle cx="28" cy="-32" r="3" fill="#fbbf24"/>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
