<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>
  
  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">LEGENDARY</text>
  
  <!-- 3D Gold Crown Artwork -->
  <g transform="translate(128, 142)" filter="url(#crownGlow)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="46" rx="58" ry="10" fill="#291305" opacity="0.6"/>
    
    <!-- Red Velvet Cushion Inside -->
    <path d="M-44,22 C-44,-10 44,-10 44,22 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
    
    <!-- Crown Spikes and Body -->
    <path d="M-56,22 L-64,-24 L-32,-6 L0,-44 L32,-6 L64,-24 L56,22 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
    
    <!-- Base Headband -->
    <rect x="-56" y="22" width="112" height="18" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    
    <!-- Jewels on Peak Tips -->
    <circle cx="-64" cy="-24" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>
    <circle cx="-32" cy="-6" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <circle cx="0" cy="-44" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="32" cy="-6" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <circle cx="64" cy="-24" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Rubies on Headband -->
    <circle cx="-36" cy="31" r="4" fill="#ef4444"/>
    <circle cx="-12" cy="31" r="4" fill="#3b82f6"/>
    <circle cx="12" cy="31" r="4" fill="#10b981"/>
    <circle cx="36" cy="31" r="4" fill="#ef4444"/>
  </g>
  
  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
