<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="goldPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="sproutGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="0.5">EPIC</text>

  <!-- 3D Official Golden Sprout -->
  <g transform="translate(128, 142)" filter="url(#sproutGlow)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="50" rx="42" ry="10" fill="#022c22" opacity="0.6"/>

    <!-- Golden Coin Soil Base -->
    <path d="M-34,22 L-26,44 C-26,48 26,48 26,44 L34,22 Z" fill="url(#goldPot)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="0" cy="22" rx="34" ry="9" fill="#fef08a"/>
    <ellipse cx="0" cy="22" rx="30" ry="7" fill="#451a03"/>

    <!-- Green Sprout Stem -->
    <path d="M0,22 C-3,2 3,-15 0,-28" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Sprout Leaf -->
    <path d="M0,-8 C-16,-10 -32,-32 -8,-32 C-2,-20 0,-8 0,-8 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1"/>
    <!-- Left Leaf Vein -->
    <path d="M0,-8 C-4,-16 -12,-22 -16,-26" fill="none" stroke="#bbf7d0" stroke-width="1.2"/>

    <!-- Right Sprout Leaf -->
    <path d="M0,-16 C16,-18 32,-40 8,-40 C2,-28 0,-16 0,-16 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="1"/>
    <!-- Right Leaf Vein -->
    <path d="M0,-16 C4,-24 12,-30 16,-34" fill="none" stroke="#bbf7d0" stroke-width="1.2"/>

    <!-- Glowing Dew Drop -->
    <circle cx="-16" cy="-24" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="16" cy="-32" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
