<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#831843" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="rocketNose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="rocketGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>
  
  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#f472b6" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#f472b6" text-anchor="middle" letter-spacing="0.5">EPIC</text>
  
  <!-- 3D Rocket Artwork -->
  <g transform="translate(128, 142) rotate(45)" filter="url(#rocketGlow)">
    <!-- Exhaust Plume -->
    <path d="M-10,32 C-20,62 -6,88 0,102 C6,88 20,62 10,32 Z" fill="#fb923c"/>
    <path d="M-5,32 C-10,54 -2,72 0,82 C2,72 10,54 5,32 Z" fill="#fef08a"/>

    <!-- Left Fin -->
    <path d="M-22,12 L-42,36 C-42,36 -28,38 -15,32 Z" fill="url(#rocketNose)"/>
    <!-- Right Fin -->
    <path d="M22,12 L42,36 C42,36 28,38 15,32 Z" fill="url(#rocketNose)"/>

    <!-- Fuselage Body -->
    <path d="M0,-54 C24,-28 22,24 18,34 C12,36 -12,36 -18,34 C-22,24 -24,-28 0,-54 Z" fill="url(#rocketBody)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

    <!-- Nose Cone -->
    <path d="M0,-54 C15,-36 20,-20 20,-18 C10,-15 -10,-15 -20,-18 C-20,-20 -15,-36 0,-54 Z" fill="url(#rocketNose)"/>

    <!-- Glass Porthole -->
    <circle cx="0" cy="-2" r="12" fill="#0f172a" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="0" cy="-2" r="9" fill="#0284c7"/>
    <ellipse cx="-3" cy="-5" rx="3" ry="5" transform="rotate(-30, -3, -5)" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
