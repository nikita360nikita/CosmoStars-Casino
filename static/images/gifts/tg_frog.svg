<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#052e16" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Frog Skin Gradient -->
    <radialGradient id="frogSkin" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <!-- Crown Gold -->
    <linearGradient id="frogCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="frogGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="86" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#4ade80" stroke-width="1"/>
  <text x="65" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="0.5">LEGENDARY</text>

  <!-- 3D Official Telegram Kissed Frog Prince -->
  <g transform="translate(128, 142)" filter="url(#frogGlow)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="52" rx="48" ry="11" fill="#052e16" opacity="0.6"/>

    <!-- Hind Legs / Flippers -->
    <ellipse cx="-38" cy="38" rx="14" ry="18" transform="rotate(-30, -38, 38)" fill="url(#frogSkin)"/>
    <ellipse cx="38" cy="38" rx="14" ry="18" transform="rotate(30, 38, 38)" fill="url(#frogSkin)"/>

    <!-- Torso / Belly -->
    <ellipse cx="0" cy="24" rx="38" ry="28" fill="url(#frogSkin)"/>
    <ellipse cx="0" cy="26" rx="26" ry="18" fill="#bbf7d0" opacity="0.8"/>

    <!-- Front Paws -->
    <ellipse cx="-16" cy="44" rx="8" ry="12" fill="url(#frogSkin)"/>
    <ellipse cx="16" cy="44" rx="8" ry="12" fill="url(#frogSkin)"/>

    <!-- Big Cute Frog Head -->
    <ellipse cx="0" cy="-10" rx="42" ry="26" fill="url(#frogSkin)"/>

    <!-- Big Frog Eyeballs -->
    <circle cx="-24" cy="-28" r="16" fill="url(#frogSkin)"/>
    <circle cx="-24" cy="-28" r="12" fill="#ffffff"/>
    <circle cx="-22" cy="-28" r="7" fill="#0f172a"/>
    <circle cx="-24" cy="-30" r="2.5" fill="#ffffff"/>

    <circle cx="24" cy="-28" r="16" fill="url(#frogSkin)"/>
    <circle cx="24" cy="-28" r="12" fill="#ffffff"/>
    <circle cx="22" cy="-28" r="7" fill="#0f172a"/>
    <circle cx="20" cy="-30" r="2.5" fill="#ffffff"/>

    <!-- Golden Prince Crown on Head -->
    <g transform="translate(0, -42)">
      <polygon points="-16,4 -20,-14 -8,-6 0,-18 8,-6 20,-14 16,4" fill="url(#frogCrown)" stroke="#b45309" stroke-width="1"/>
      <circle cx="0" cy="-18" r="2.5" fill="#ef4444"/>
      <circle cx="-20" cy="-14" r="2" fill="#3b82f6"/>
      <circle cx="20" cy="-14" r="2" fill="#3b82f6"/>
    </g>

    <!-- Rosy Cheek Blushes -->
    <circle cx="-26" cy="-4" r="6" fill="#f43f5e" opacity="0.45"/>
    <circle cx="26" cy="-4" r="6" fill="#f43f5e" opacity="0.45"/>

    <!-- Smiling Mouth -->
    <path d="M-18,-4 Q0,10 18,-4" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Kiss Lipstick Mark on Cheek -->
    <g transform="translate(24, 6) rotate(-15) scale(0.7)">
      <path d="M-8,-2 C-14,-8 -6,-12 0,-4 C6,-12 14,-8 8,-2 C4,4 -4,4 -8,-2 Z" fill="#e11d48"/>
    </g>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
