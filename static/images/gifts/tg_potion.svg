<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#581c87" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Glowing Potion Liquid -->
    <radialGradient id="liquidGrad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <!-- Cork Stopper -->
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="potionGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#c084fc" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">EPIC</text>

  <!-- 3D Official Telegram Magic Potion Flask -->
  <g transform="translate(128, 142)" filter="url(#potionGlow)">
    <!-- Ambient Shadow -->
    <ellipse cx="0" cy="50" rx="42" ry="10" fill="#1e1035" opacity="0.6"/>

    <!-- Glass Flask Spherical Body -->
    <circle cx="0" cy="12" r="38" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- Glowing Liquid Fill (Half-full Sphere) -->
    <path d="M-36,12 A36,36 0 0,0 36,12 Q0,24 -36,12 Z" fill="url(#liquidGrad)"/>
    <ellipse cx="0" cy="12" rx="36" ry="7" fill="#f472b6" opacity="0.8"/>

    <!-- Flask Neck -->
    <path d="M-12,-20 L-12,-38 L12,-38 L12,-20 Z" fill="rgba(192, 132, 252, 0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Flask Lip Ring -->
    <ellipse cx="0" cy="-38" rx="15" ry="4" fill="rgba(255,255,255,0.6)" stroke="#ffffff" stroke-width="1"/>

    <!-- Cork Stopper -->
    <polygon points="-11,-39 -13,-52 13,-52 11,-39" fill="url(#corkGrad)" stroke="#451a03" stroke-width="1"/>

    <!-- Magic Bubbles inside Potion -->
    <circle cx="-14" cy="24" r="4" fill="#ffffff" opacity="0.75"/>
    <circle cx="12" cy="28" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="4" cy="18" r="5" fill="#fef08a" opacity="0.85"/>

    <!-- Specular Highlight Curve on Glass -->
    <path d="M-26,-4 C-32,6 -30,24 -18,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
