<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Matte Black Cap Fabric -->
    <radialGradient id="capMatte" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="capGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#60a5fa" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">MYTHIC</text>

  <!-- 3D Official Durov's Baseball Cap -->
  <g transform="translate(128, 142)" filter="url(#capGlow)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="46" rx="56" ry="12" fill="#020617" opacity="0.7"/>

    <!-- Cap Dome Crown -->
    <path d="M-52,18 C-52,-38 52,-38 52,18 Z" fill="url(#capMatte)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Panel Seam Stitch Lines -->
    <path d="M0,-36 L0,18" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <path d="M0,-36 C-24,-14 -38,2 -46,18" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <path d="M0,-36 C24,-14 38,2 46,18" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Top Cap Button (Squatchee) -->
    <ellipse cx="0" cy="-36" rx="7" ry="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>

    <!-- Curved Baseball Visor / Peak -->
    <path d="M-52,14 C-58,34 -20,44 0,44 C20,44 58,34 52,14 Q0,26 -52,14 Z" fill="url(#visorGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Visor Specular Edge Reflection -->
    <path d="M-48,18 C-52,32 -18,41 0,41 C18,41 52,32 48,18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>

    <!-- Gold Embossed Official Telegram Plane / Star Logo on Front -->
    <g transform="translate(0, -6)">
      <circle cx="0" cy="0" r="14" fill="#090d16" stroke="url(#goldEmblem)" stroke-width="2"/>
      <!-- Telegram Plane Icon in Gold -->
      <path d="M-7,-1 L7,-6 L3,6 L0,2 Z" fill="url(#goldEmblem)"/>
    </g>

    <!-- Side Ventilation Eyelets -->
    <circle cx="-32" cy="-8" r="2.5" fill="#020617" stroke="#64748b" stroke-width="1"/>
    <circle cx="32" cy="-8" r="2.5" fill="#020617" stroke="#64748b" stroke-width="1"/>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
