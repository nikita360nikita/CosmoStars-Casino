<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#082f49" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>
  
  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">COMMON</text>
  
  <!-- 3D Faceted Sapphire Star Artwork -->
  <g transform="translate(128, 142)" filter="url(#starGlow)">
    <polygon points="0,-64 19,-19 64,-19 28,11 42,56 0,28 -42,56 -28,11 -64,-19 -19,-19" fill="#082f49" transform="translate(0, 6)"/>
    
    <polygon points="0,-64 0,0 -19,-19" fill="url(#facetLight)"/>
    <polygon points="0,-64 19,-19 0,0" fill="#bae6fd"/>
    <polygon points="19,-19 64,-19 0,0" fill="url(#facetLight)"/>
    <polygon points="64,-19 28,11 0,0" fill="url(#facetDark)"/>
    <polygon points="28,11 42,56 0,0" fill="url(#facetLight)"/>
    <polygon points="42,56 0,28 0,0" fill="url(#facetDark)"/>
    <polygon points="0,28 -42,56 0,0" fill="#0369a1"/>
    <polygon points="-42,56 -28,11 0,0" fill="url(#facetLight)"/>
    <polygon points="-28,11 -64,-19 0,0" fill="url(#facetDark)"/>
    <polygon points="-64,-19 -19,-19 0,0" fill="url(#facetLight)"/>

    <line x1="0" y1="-64" x2="0" y2="28" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
    <line x1="-64" y1="-19" x2="28" y2="11" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
