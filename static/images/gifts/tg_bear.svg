<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0d18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Bear Fur Gradients -->
    <radialGradient id="furBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="furHead" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="bearGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg_glow)" stroke="url(#border_grad)" stroke-width="3"/>
  <text x="210" y="44" font-size="20" opacity="0.4" text-anchor="middle" fill="#ffb703">⭐️</text>

  <rect x="22" y="24" width="76" height="20" rx="6" fill="rgba(0,0,0,0.5)" stroke="#f59e0b" stroke-width="1"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">RARE</text>

  <!-- 3D Official Telegram Plush Bear -->
  <g transform="translate(128, 142)" filter="url(#bearGlow)">
    <!-- Ambient Shadow -->
    <ellipse cx="0" cy="52" rx="46" ry="10" fill="#1c0e04" opacity="0.6"/>

    <!-- Left & Right Ears -->
    <g>
      <circle cx="-36" cy="-42" r="16" fill="url(#furHead)"/>
      <circle cx="-36" cy="-42" r="9" fill="#fde68a" opacity="0.85"/>
      <circle cx="36" cy="-42" r="16" fill="url(#furHead)"/>
      <circle cx="36" cy="-42" r="9" fill="#fde68a" opacity="0.85"/>
    </g>

    <!-- Torso / Body -->
    <ellipse cx="0" cy="18" rx="38" ry="34" fill="url(#furBody)"/>
    <ellipse cx="0" cy="22" rx="24" ry="20" fill="#fde68a" opacity="0.45"/>

    <!-- Paws (Arms) -->
    <ellipse cx="-34" cy="12" rx="13" ry="18" transform="rotate(25, -34, 12)" fill="url(#furBody)"/>
    <ellipse cx="34" cy="12" rx="13" ry="18" transform="rotate(-25, 34, 12)" fill="url(#furBody)"/>

    <!-- Feet (Legs) -->
    <g>
      <ellipse cx="-26" cy="42" rx="16" ry="12" fill="url(#furBody)"/>
      <circle cx="-26" cy="42" r="8" fill="#fde68a" opacity="0.7"/>
      <ellipse cx="26" cy="42" rx="16" ry="12" fill="url(#furBody)"/>
      <circle cx="26" cy="42" r="8" fill="#fde68a" opacity="0.7"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-18" r="34" fill="url(#furHead)"/>

    <!-- Muzzle -->
    <ellipse cx="0" cy="-12" rx="17" ry="13" fill="url(#muzzleGrad)"/>
    <!-- Nose -->
    <path d="M-6,-16 L6,-16 C6,-16 0,-9 -6,-16 Z" fill="#1e1b4b"/>
    <!-- Stitched Mouth -->
    <path d="M0,-12 L0,-7 C-4,-7 -7,-9 -7,-9 M0,-7 C4,-7 7,-9 7,-9" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eyes with Catchlight -->
    <circle cx="-13" cy="-24" r="4.5" fill="#1c0e04"/>
    <circle cx="-14.5" cy="-25.5" r="1.5" fill="#ffffff"/>
    <circle cx="13" cy="-24" r="4.5" fill="#1c0e04"/>
    <circle cx="11.5" cy="-25.5" r="1.5" fill="#ffffff"/>

    <!-- Satin Crimson Bow Ribbon around neck -->
    <g transform="translate(0, 4)">
      <!-- Left knot loop -->
      <path d="M0,0 C-10,-10 -20,-4 -10,2 Z" fill="url(#ribbonRed)" stroke="#ffffff" stroke-width="0.8"/>
      <!-- Right knot loop -->
      <path d="M0,0 C10,-10 20,-4 10,2 Z" fill="url(#ribbonRed)" stroke="#ffffff" stroke-width="0.8"/>
      <!-- Ribbon Center Button -->
      <circle cx="0" cy="0" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    </g>
  </g>

  <rect x="78" y="214" width="100" height="20" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="128" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">TELEGRAM NFT</text>
</svg>
